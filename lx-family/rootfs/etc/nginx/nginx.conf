user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 64M;

    # Map WebSocket upgrade headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Normalize Ingress path: strip trailing slash if present
    map $http_x_ingress_path $ingress_path {
        ~^(.*)/$ $1;
        default  $http_x_ingress_path;
    }

    server {
        listen 3001 default_server;
        listen [::]:3001 default_server;
        server_name _;

        server_tokens off;
        absolute_redirect off;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Ingress-Path $ingress_path;

            # Disable upstream gzip so sub_filter can inspect and rewrite uncompressed text
            proxy_set_header Accept-Encoding "";

            # Handle redirects and cookie paths for Ingress subpath
            proxy_redirect / $ingress_path/;
            proxy_cookie_path / $ingress_path/;

            # Dynamic path rewriting via sub_filter
            sub_filter_once off;
            sub_filter_types text/html text/javascript application/javascript text/css;

            # HTML attributes and scripts
            sub_filter 'href="/' 'href="$ingress_path/';
            sub_filter 'src="/' 'src="$ingress_path/';
            sub_filter 'action="/' 'action="$ingress_path/';

            # Vite and SPA asset & API paths in scripts/HTML
            sub_filter '"/assets/' '"$ingress_path/assets/';
            sub_filter "'/assets/" "'$ingress_path/assets/";
            sub_filter '"/api/' '"$ingress_path/api/';
            sub_filter "'/api/" "'$ingress_path/api/";
            sub_filter '`/api/' '`$ingress_path/api/';
            sub_filter '"/manifest.json"' '"$ingress_path/manifest.json"';
            sub_filter '"/icon-192.png"' '"$ingress_path/icon-192.png"';
            sub_filter '"/favicon.ico"' '"$ingress_path/favicon.ico"';

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
