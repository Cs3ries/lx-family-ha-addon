name: "LX Family"
slug: "lx_family"
version: "1.20.0"
description: "Privates Family OS für Kalender, Aufgaben, Essen, Einkauf und Kinderabenteuer"
url: "https://github.com/laxxx-lab/lx-family-planner"
arch:
  - aarch64
  - amd64
startup: "application"
boot: "auto"
init: false
ingress: true
ingress_port: 3001
panel_icon: "mdi:calendar-heart"
panel_title: "Familienplaner"
homeassistant_api: true
map:
  - data:rw
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: "Direkter Zugriff (z. B. für native Android-App)"
options:
  app_secret: ""
  registration_mode: "first-family"
  registration_invite_code: ""
  public_family_directory: false
  app_language: "de"
  timezone: "Europe/Berlin"
  calendar_sync_interval_minutes: 60
  event_reminder_interval_seconds: 30
  calendar_allow_private_hosts: true
schema:
  app_secret: "str?"
  registration_mode: "list(first-family|invite|open|closed)?"
  registration_invite_code: "str?"
  public_family_directory: "bool?"
  app_language: "list(de|en|fr|es|it|nl|pl)?"
  timezone: "str?"
  calendar_sync_interval_minutes: "int?"
  event_reminder_interval_seconds: "int?"
  calendar_allow_private_hosts: "bool?"
