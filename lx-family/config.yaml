ports_description:
  3001/tcp: "Beta: direkter Zugriff für Android (Standard-Hostport 3002)"
options:
  app_secret: ""
  registration_mode: "first-family"
  registration_invite_code: ""
  public_family_directory: false
  app_language: "de"
  timezone: "Europe/Berlin"
