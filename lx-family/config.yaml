name: "LX Family Beta"
slug: "lx_family_beta"
version: "1.22.1-beta.1"
description: "Beta: Firebase-Dateianbindung und persistente eigene APKs testen"
url: "https://github.com/Cs3ries/lx-family-ha-addon/tree/beta"
arch:
  - aarch64
  - amd64
startup: "application"
boot: "manual"
stage: "experimental"
init: false
ingress: true
ingress_port: 3001
panel_icon: "mdi:calendar-heart"
panel_title: "Familienplaner Beta"
