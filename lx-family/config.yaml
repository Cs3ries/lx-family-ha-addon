  event_reminder_interval_seconds: 30
  calendar_allow_private_hosts: true
schema:
  app_secret: "str?"
  registration_mode: "list(first-family|invite|open|closed)?"
  registration_invite_code: "str?"
  public_family_directory: "bool?"
  app_language: "list(de|en|fr|es|it|nl|pl)?"
  timezone: "str?"
  calendar_sync_interval_minutes: "int?"
  event_reminder_interval_seconds: "int?"
  calendar_allow_private_hosts: "bool?"
