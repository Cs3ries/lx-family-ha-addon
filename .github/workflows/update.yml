name: Automatische Updates aus Original-Repository

on:
  schedule:
    # Prüft einmal täglich (alle 24 Stunden) um 04:00 Uhr UTC auf neue Versionen
    - cron: "0 4 * * *"
  # Erlaubt manuelles Auslösen der Prüfung im GitHub Actions Tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-upstream-update:
    name: Prüfe Original-Repo auf neue Releases & Baue Add-on
    runs-on: ubuntu-latest
    steps:
      - name: Add-on Repository auschecken
        uses: actions/checkout@v4

      - name: Neueste Version von laxxx-lab/lx-family-planner ermitteln
        id: upstream
        run: |
          LATEST_JSON=$(curl -sL https://api.github.com/repos/laxxx-lab/lx-family-planner/releases/latest)
          LATEST_TAG=$(echo "$LATEST_JSON" | grep -m1 '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')

          if [ -z "$LATEST_TAG" ]; then
            echo "Fehler: Konnte tag_name nicht ermitteln."
            exit 1
          fi

          LATEST_VERSION="${LATEST_TAG#v}"
          CURRENT_VERSION=$(grep '^version:' lx-family/config.yaml | awk '{print $2}' | tr -d '"')

          echo "Neueste Version im Original-Repo: ${LATEST_VERSION}"
          echo "Aktuelle Version im Add-on:        ${CURRENT_VERSION}"

          # Speichere Release-Notes temporär für CHANGELOG.md
          echo "$LATEST_JSON" | jq -r '.body // empty' > /tmp/upstream_release_body.txt

          echo "latest_version=${LATEST_VERSION}" >> $GITHUB_OUTPUT
          echo "current_version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT

      - name: Add-on Dateien aktualisieren
        if: steps.upstream.outputs.latest_version != steps.upstream.outputs.current_version
        run: |
          VERSION="${{ steps.upstream.outputs.latest_version }}"
          echo "Neue Version erkannt: ${VERSION}. Aktualisiere Dateien..."

          # config.yaml aktualisieren
          sed -i "s/^version:.*/version: \"${VERSION}\"/" lx-family/config.yaml

          # build.yaml aktualisieren (Multi-Arch Tag)
          sed -i -E "s|ghcr.io/laxxx-lab/lx-family-planner:[^\"']+|ghcr.io/laxxx-lab/lx-family-planner:${VERSION}|g" lx-family/build.yaml

          # CHANGELOG.md aktualisieren
          DATE=$(date +'%Y-%m-%d')
          TEMP_FILE=$(mktemp)
          {
            echo "# Changelog"
            echo ""
            echo "## ${VERSION} (${DATE})"
            echo ""
            if [ -s /tmp/upstream_release_body.txt ]; then
              echo "### Neuheiten im Original-Release (laxxx-lab/lx-family-planner):"
              cat /tmp/upstream_release_body.txt | sed -E '/^#[[:space:]]+.*(1\.[0-9]+|LX Family).*/d; s/^##[[:space:]]+/#### /'
              echo ""
              echo "### Add-on Änderungen:"
            fi
            echo "- Automatische Aktualisierung auf LX Family ${VERSION} aus dem Original-Repository (laxxx-lab/lx-family-planner)."
            echo "- Ingress-Proxy Schicht (Nginx) und Pfad-Rewriting aktiv."
            echo ""
            sed '/^# Changelog/d' lx-family/CHANGELOG.md
          } > "$TEMP_FILE"
          mv "$TEMP_FILE" lx-family/CHANGELOG.md

      - name: Set up QEMU
        if: steps.upstream.outputs.latest_version != steps.upstream.outputs.current_version || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.upstream.outputs.latest_version != steps.upstream.outputs.current_version || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Multi-Arch Image mit Ingress-Proxy Schicht bauen (Buildx)
        if: steps.upstream.outputs.latest_version != steps.upstream.outputs.current_version || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./lx-family
          file: ./lx-family/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_FROM=ghcr.io/laxxx-lab/lx-family-planner:${{ steps.upstream.outputs.latest_version }}
          push: false
          tags: lx-family:latest

      - name: Git Commit & Push
        if: steps.upstream.outputs.latest_version != steps.upstream.outputs.current_version
        run: |
          VERSION="${{ steps.upstream.outputs.latest_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lx-family/config.yaml lx-family/build.yaml lx-family/CHANGELOG.md
          git commit -m "chore(release): update LX Family to ${VERSION} from upstream (ingress-ready)"
          git push
          echo "Erfolgreich gepusht: LX Family v${VERSION}"
