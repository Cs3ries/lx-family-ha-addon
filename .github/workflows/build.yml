name: Build, Test & Release Beta

on:
  push:
    branches: [ beta ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/beta'
    name: Test Multi-Arch Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Add-on Repository auschecken
        uses: actions/checkout@v4

      - name: Ermittle Basis-Version
        id: version
        run: |
          CURRENT_VERSION=$(bash scripts/upstream-version.sh)
          echo "Upstream-Version: ${CURRENT_VERSION}"
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test optional integrations and update compatibility
        run: |
          for script in lx-family/run.sh update.sh scripts/upstream-version.sh; do bash -n "$script"; done
          node --test tests/*.test.cjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Baue Docker-Image für ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: ./lx-family
          file: ./lx-family/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=ghcr.io/laxxx-lab/lx-family-planner:${{ steps.version.outputs.version }}
          push: false
          tags: lx-family:${{ matrix.arch }}

  prerelease:
    name: Publish beta pre-release
    needs: build
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create pre-release after successful builds
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const config = fs.readFileSync('lx-family/config.yaml', 'utf8');
            const version = config.match(/^version: "([0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+)"$/m)?.[1];
            if (!version) throw new Error('Expected an explicit beta version');
            const tag = `v${version}`;
            try {
              const existing = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              if (!existing.data.prerelease) throw new Error('Existing tag is not a pre-release');
              core.info(`Pre-release ${tag} already exists; not overwriting it.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `LX Family Beta ${version}`,
              body: fs.readFileSync('BETA_RELEASE.md', 'utf8'),
              draft: false,
              prerelease: true,
              make_latest: 'false'
            });
